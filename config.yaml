indicators:
  ma:
    short: 5
    mid_short: 10
    mid: 20
    long: 60
  macd:
    fast: 12
    slow: 26
    signal: 9
  adx:
    period: 14
    threshold: 25
  kd:
    k_period: 9
    d_period: 3
    smooth: 3
    oversold: 30
  rsi:
    period: 14
    oversold: 30
    recover: 40
  bbands:
    period: 20
    std: 2.0
  atr:
    period: 14
    expansion_ratio: 1.3
  volume:
    avg_period: 5
    surge_ratio: 1.5
  obv:
    lookback: 20

rules:
  # 趨勢類
  ma_golden_cross:         { enabled: true, category: trend,      schools: [general] }
  ma_bullish_alignment:    { enabled: true, category: trend,      schools: [zhu] }
  ma_converge_breakout:    { enabled: true, category: trend,      schools: [zhu] }
  pullback_holds_ma20:     { enabled: true, category: trend,      schools: [zhu] }
  macd_hist_turn_positive: { enabled: true, category: trend,      schools: [general] }
  adx_strong_uptrend:      { enabled: true, category: trend,      schools: [general] }
  # 動能類
  kd_oversold_golden:      { enabled: true, category: momentum,   schools: [general, zhu] }
  rsi_recover:             { enabled: true, category: momentum,   schools: [general] }
  # 量價類
  volume_breakout:         { enabled: true, category: volume,     schools: [general, zhu] }
  price_volume_surge:      { enabled: true, category: volume,     schools: [general, zhu] }
  obv_new_high:            { enabled: true, category: volume,     schools: [general] }
  volume_dry_red_surge:    { enabled: true, category: volume,     schools: [zhu] }
  # 波動類
  bbands_lower_bounce:     { enabled: true, category: volatility, schools: [general] }
  bbands_upper_break:      { enabled: true, category: volatility, schools: [general] }
  atr_expansion:           { enabled: true, category: volatility, schools: [general] }
  # 型態類
  long_red_breakout:       { enabled: true, category: pattern,    schools: [zhu] }
  long_lower_shadow:       { enabled: true, category: pattern,    schools: [zhu] }
  doji_or_spinning_top:    { enabled: true, category: pattern,    schools: [zhu] }
  double_bottom:           { enabled: true, category: pattern,    schools: [zhu] }
